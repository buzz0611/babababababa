<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バスケットボール ポジション解説</title>
</head>
<body>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #1f2430;
    --sub: #5b6270;
    --chip: #f0eee8;
    --bar-bg: #edeae2;
    --tip-bg: #fdf3ec;
    --court: #e8b06d;
    --court-paint: #d99a54;
    --court-line: #ffffff;
    --accent: #d95d39;
    --shadow: 0 6px 24px rgba(31,36,48,.10);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1e25;
      --card: #262a33;
      --ink: #e8e9ec;
      --sub: #9aa1ad;
      --chip: #333844;
      --bar-bg: #333844;
      --tip-bg: #33291f;
      --shadow: 0 6px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1e25;
    --card: #262a33;
    --ink: #e8e9ec;
    --sub: #9aa1ad;
    --chip: #333844;
    --bar-bg: #333844;
    --tip-bg: #33291f;
    --shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  :root[data-theme="light"] {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #1f2430;
    --sub: #5b6270;
    --chip: #f0eee8;
    --bar-bg: #edeae2;
    --tip-bg: #fdf3ec;
    --shadow: 0 6px 24px rgba(31,36,48,.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  header {
    text-align: center;
    padding: 40px 20px 16px;
  }
  header h1 {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    letter-spacing: .04em;
  }
  header h1 .ball { color: var(--accent); }
  header p {
    color: var(--sub);
    margin-top: 8px;
    font-size: .95rem;
  }
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px 20px 60px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .container { grid-template-columns: 1fr; }
  }

  /* ---- コート ---- */
  .court-panel {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    position: sticky;
    top: 16px;
  }
  @media (max-width: 820px) {
    .court-panel { position: static; }
  }
  .court-panel h2 {
    font-size: 1rem;
    color: var(--sub);
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  svg.court { width: 100%; height: auto; display: block; border-radius: 12px; }
  .pos-marker { cursor: pointer; }
  .pos-marker circle.dot {
    stroke: #fff;
    stroke-width: 3;
    transition: r .15s ease, filter .15s ease;
  }
  .pos-marker text {
    fill: #fff;
    font-weight: 700;
    font-size: 15px;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
    user-select: none;
  }
  .pos-marker:hover circle.dot { filter: brightness(1.12); }
  .pos-marker.active circle.dot {
    filter: brightness(1.05);
  }
  .pos-marker circle.pulse {
    fill: none;
    stroke-width: 3;
    opacity: 0;
  }
  .pos-marker.active circle.pulse {
    animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse {
    0%   { opacity: .8; r: 20; }
    100% { opacity: 0;  r: 34; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pos-marker.active circle.pulse { animation: none; }
    .bar > span { transition: none !important; }
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
  }
  .legend button {
    border: 2px solid transparent;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: .85rem;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .legend button:hover { transform: translateY(-2px); }
  .legend button:focus-visible,
  .pos-marker:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .legend button.active {
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px currentColor;
  }

  /* ---- モード切替 ---- */
  .mode-tabs {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin: 4px auto 0;
    background: var(--card);
    border-radius: 999px;
    padding: 6px;
    width: fit-content;
    box-shadow: var(--shadow);
  }
  .mode-tabs button {
    border: none;
    border-radius: 999px;
    padding: 8px 22px;
    font-size: .9rem;
    font-weight: 700;
    font-family: inherit;
    background: transparent;
    color: var(--sub);
    cursor: pointer;
    transition: background-color .15s ease, color .15s ease;
  }
  .mode-tabs button.active {
    background: var(--accent);
    color: #fff;
  }
  .mode-tabs button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---- フォーメーション再生 ---- */
  .play-select {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
  }
  .play-select button {
    border: 2px solid var(--accent);
    border-radius: 999px;
    background: transparent;
    color: var(--accent);
    padding: 6px 14px;
    font-size: .85rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform .12s ease;
  }
  .play-select button:hover { transform: translateY(-2px); }
  .play-select button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .play-select button.active {
    background: var(--accent);
    color: #fff;
  }
  .play-group-label {
    width: 100%;
    text-align: center;
    font-size: .75rem;
    font-weight: 700;
    color: var(--sub);
    letter-spacing: .08em;
    margin-top: 6px;
  }
  .transport {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
  }
  .transport button {
    border: none;
    border-radius: 10px;
    padding: 8px 18px;
    font-size: .9rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: var(--chip);
    color: var(--ink);
  }
  .transport button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .transport button.primary {
    background: var(--accent);
    color: #fff;
    min-width: 8.5em;
  }
  .transport .speed { display: flex; gap: 4px; }
  .transport .speed button { font-size: .8rem; padding: 8px 12px; }
  .transport .speed button.active {
    box-shadow: inset 0 0 0 2px var(--accent);
    color: var(--accent);
  }
  .steps {
    list-style: none;
    counter-reset: step;
    margin-bottom: 4px;
  }
  .steps li {
    counter-increment: step;
    position: relative;
    padding: 8px 10px 8px 42px;
    border-radius: 10px;
    font-size: .92rem;
    color: var(--sub);
    margin-bottom: 4px;
    transition: background-color .2s ease;
  }
  .steps li::before {
    content: counter(step);
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--chip);
    color: var(--sub);
    font-weight: 700;
    font-size: .8rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .steps li.current {
    background: var(--tip-bg);
    color: var(--ink);
    font-weight: 600;
  }
  .steps li.current::before { background: var(--accent); color: #fff; }
  .steps li.done { opacity: .55; }
  .goal-flash { animation: goalflash .8s ease-out; }
  @keyframes goalflash {
    0%   { opacity: 1; r: 14; }
    100% { opacity: 0; r: 46; }
  }

  /* ---- 解説カード ---- */
  .detail {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .detail-header {
    padding: 24px 24px 18px;
    color: #fff;
    transition: background-color .25s ease;
  }
  .detail-header .number {
    font-size: .8rem;
    font-weight: 700;
    opacity: .85;
    letter-spacing: .1em;
  }
  .detail-header h2 {
    font-size: 1.5rem;
    margin-top: 2px;
  }
  .detail-header .en {
    font-size: .9rem;
    opacity: .9;
  }
  .detail-body { padding: 22px 24px 26px; }
  .detail-body .tagline {
    font-weight: 700;
    font-size: 1.05rem;
    margin-bottom: 10px;
  }
  .detail-body p.desc {
    color: var(--sub);
    font-size: .95rem;
    margin-bottom: 18px;
  }
  .section-title {
    font-size: .8rem;
    font-weight: 700;
    color: var(--sub);
    letter-spacing: .08em;
    margin-bottom: 8px;
    border-left: 4px solid var(--accent);
    padding-left: 8px;
  }
  ul.roles {
    list-style: none;
    margin-bottom: 18px;
  }
  ul.roles li {
    position: relative;
    padding-left: 22px;
    font-size: .93rem;
    margin-bottom: 6px;
  }
  ul.roles li::before {
    content: "●";
    position: absolute;
    left: 4px;
    font-size: .6rem;
    top: .45em;
    color: var(--accent);
  }
  .stats { margin-bottom: 18px; }
  .stat-row {
    display: grid;
    grid-template-columns: 7em 1fr 2.5em;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: .85rem;
  }
  .bar {
    background: var(--bar-bg);
    border-radius: 999px;
    height: 10px;
    overflow: hidden;
  }
  .bar > span {
    display: block;
    height: 100%;
    border-radius: 999px;
    width: 0;
    transition: width .5s ease;
  }
  .stat-val {
    text-align: right;
    font-weight: 700;
    color: var(--sub);
    font-variant-numeric: tabular-nums;
  }
  .players {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .players span {
    background: var(--chip);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: .85rem;
    font-weight: 600;
  }
  .tip {
    margin-top: 18px;
    background: var(--tip-bg);
    border-left: 4px solid var(--accent);
    border-radius: 0 10px 10px 0;
    padding: 12px 14px;
    font-size: .88rem;
  }
  .tip strong { color: var(--accent); }

  footer {
    text-align: center;
    color: var(--sub);
    font-size: .8rem;
    padding: 0 20px 40px;
  }
</style>

<header>
  <h1><span class="ball">🏀</span> バスケットボール ポジション解説</h1>
  <p>コート上のマーカー、またはボタンをタップして各ポジションの役割を見てみよう</p>
  <p style="margin-top:6px"><a href="stats.html" style="color:var(--accent); font-size:.9rem; text-decoration:none; border-bottom:1px dashed currentColor;">📊 スタッツ記録・可視化アプリはこちら →</a></p>
</header>

<nav class="mode-tabs" aria-label="表示モード">
  <button id="tabPositions" class="active">ポジション解説</button>
  <button id="tabPlays">フォーメーション</button>
</nav>

<div class="container">

  <!-- コート -->
  <div class="court-panel">
    <h2 id="courtTitle">ハーフコートでの基本配置（オフェンス時の一例）</h2>
    <svg class="court" viewBox="0 0 500 470" role="img" aria-label="バスケットボールのハーフコート図">
      <rect x="0" y="0" width="500" height="470" fill="var(--court)" rx="12"/>
      <rect x="15" y="15" width="470" height="440" fill="none" stroke="var(--court-line)" stroke-width="4"/>
      <rect x="170" y="15" width="160" height="190" fill="var(--court-paint)" stroke="var(--court-line)" stroke-width="4"/>
      <circle cx="250" cy="205" r="60" fill="none" stroke="var(--court-line)" stroke-width="4"/>
      <path d="M 45 15 L 45 60 A 230 230 0 0 0 455 60 L 455 15" fill="none" stroke="var(--court-line)" stroke-width="4"/>
      <line x1="215" y1="30" x2="285" y2="30" stroke="var(--court-line)" stroke-width="5"/>
      <circle cx="250" cy="50" r="12" fill="none" stroke="#c1440e" stroke-width="4"/>
      <path d="M 190 455 A 60 60 0 0 1 310 455" fill="none" stroke="var(--court-line)" stroke-width="4"/>
      <g id="markers"></g>
      <g id="playersG" style="display:none"></g>
    </svg>
    <div class="legend" id="legend"></div>
    <div id="playControls" hidden>
      <div class="play-select" id="playSelect"></div>
      <div class="transport">
        <button class="primary" id="btnPlay">▶ 再生</button>
        <button id="btnReset">↺ リセット</button>
        <div class="speed" role="group" aria-label="再生速度">
          <button id="spdSlow">ゆっくり</button>
          <button id="spdNorm" class="active">ふつう</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 解説 -->
  <div class="detail" id="detail">
    <div class="detail-header" id="detailHeader">
      <div class="number" id="dNumber"></div>
      <h2 id="dName"></h2>
      <div class="en" id="dEn"></div>
    </div>
    <div class="detail-body">
      <div class="tagline" id="dTagline"></div>
      <p class="desc" id="dDesc"></p>

      <div class="section-title">主な役割</div>
      <ul class="roles" id="dRoles"></ul>

      <div class="section-title">求められる能力</div>
      <div class="stats" id="dStats"></div>

      <div class="section-title">代表的な選手</div>
      <div class="players" id="dPlayers"></div>

      <div class="tip" id="dTip"></div>
    </div>
  </div>

  <!-- フォーメーション解説 -->
  <div class="detail" id="formationDetail" hidden>
    <div class="detail-header" style="background: var(--accent)">
      <div class="number">フォーメーション</div>
      <h2 id="fName"></h2>
      <div class="en" id="fEn"></div>
    </div>
    <div class="detail-body">
      <p class="desc" id="fPurpose"></p>
      <div class="section-title">プレーの流れ</div>
      <ol class="steps" id="fSteps"></ol>
      <div class="tip" id="fTip"></div>
    </div>
  </div>
</div>

<footer>
  ※ 現代バスケットボールでは「ポジションレス」の考え方が広がり、役割の境界は柔軟になっています。
</footer>

const markersG = document.getElementById("markers");
const legend = document.getElementById("legend");
const svgNS = "http://www.w3.org/2000/svg";

function select(id) {
  const pos = POSITIONS.find(p => p.id === id);
  if (!pos) return;

  document.querySelectorAll(".pos-marker").forEach(m =>
    m.classList.toggle("active", m.dataset.id === id));
  document.querySelectorAll(".legend button").forEach(b => {
    b.classList.toggle("active", b.dataset.id === id);
  });

  document.getElementById("detailHeader").style.backgroundColor = pos.colorHex;
  document.getElementById("dNumber").textContent = pos.number + "ポジション";
  document.getElementById("dName").textContent = pos.name;
  document.getElementById("dEn").textContent = pos.en;
  document.getElementById("dTagline").textContent = pos.tagline;
  document.getElementById("dDesc").textContent = pos.desc;

  document.getElementById("dRoles").innerHTML =
    pos.roles.map(r => `<li>${r}</li>`).join("");

  document.getElementById("dStats").innerHTML = pos.stats.map(([label, val]) => `
    <div class="stat-row">
      <div>${label}</div>
      <div class="bar"><span style="background:${pos.colorHex}"></span></div>
      <div class="stat-val">${val}</div>
    </div>`).join("");
  requestAnimationFrame(() => {
    document.querySelectorAll("#dStats .bar > span").forEach((span, i) => {
      span.style.width = pos.stats[i][1] + "%";
    });
  });

  document.getElementById("dPlayers").innerHTML =
    pos.players.map(p => `<span>${p}</span>`).join("");
  document.getElementById("dTip").innerHTML = "💡 " + pos.tip;
}

let curPlay = PLAYS[0];
let basePos = {};
let ballHolder = null;
let segIdx = 0;
let segElapsed = 0;
let running = false;
let finished = false;
let lastTs = null;
let speed = 1;
let rafId = null;

const lerp = (a, b, t) => a + (b - a) * t;
const lerpPt = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const heldBallPos = p => [p[0] + 14, p[1] - 12];
const getActors = () => curPlay.actors || Object.keys(playerEls);

function setPositions(pos, ballPt) {
  for (const id of getActors()) {
    playerEls[id].dot.setAttribute("cx", pos[id][0]);
    playerEls[id].dot.setAttribute("cy", pos[id][1]);
    playerEls[id].label.setAttribute("x", pos[id][0]);
    playerEls[id].label.setAttribute("y", pos[id][1]);
  }
  ballEl.setAttribute("cx", ballPt[0]);
  ballEl.setAttribute("cy", ballPt[1]);
}

function updateSteps(idx) {
  document.querySelectorAll("#fSteps li").forEach((li, i) => {
    li.classList.toggle("current", i === idx);
    li.classList.toggle("done", i < idx);
  });
}

function resetPlay() {
  cancelAnimationFrame(rafId);
  running = false;
  finished = false;
  segIdx = 0;
  segElapsed = 0;
  lastTs = null;
  basePos = JSON.parse(JSON.stringify(curPlay.start));
  ballHolder = curPlay.ballStart;
  const actors = getActors();
  for (const id in playerEls) {
    playerEls[id].g.style.display = actors.includes(id) ? "" : "none";
    playerEls[id].label.textContent =
      (curPlay.labels && curPlay.labels[id]) || playerEls[id].abbr;
  }
  setPositions(basePos, heldBallPos(basePos[ballHolder]));
  flashEl.classList.remove("goal-flash");
  updateSteps(-1);
  btnPlay.textContent = "▶ 再生";
  courtTitle.textContent = curPlay.name + " — 再生ボタンでスタート";
}

function frame(ts) {
  if (!running) return;
  if (lastTs === null) lastTs = ts;
  segElapsed += (ts - lastTs) * speed;
  lastTs = ts;

  const seg = curPlay.segs[segIdx];
  const p = Math.min(1, segElapsed / seg.dur);
  const e = ease(p);

  const cur = {};
  for (const id of getActors()) {
    const from = basePos[id];
    const to = (seg.moves && seg.moves[id]) || from;
    cur[id] = lerpPt(from, to, e);
  }

  let ballPt;
  if (seg.pass) {
    const a = cur[seg.pass[0]], b = cur[seg.pass[1]];
    const pt = lerpPt(a, b, e);
    const arcH = Math.min(30, Math.hypot(b[0] - a[0], b[1] - a[1]) * .12 + 5);
    pt[1] -= arcH * Math.sin(Math.PI * e);
    ballPt = pt;
  } else if (seg.shot) {
    const pt = lerpPt(cur[seg.shot], HOOP, e);
    pt[1] -= 55 * Math.sin(Math.PI * e);
    ballPt = pt;
  } else {
    ballPt = heldBallPos(cur[ballHolder]);
  }
  setPositions(cur, ballPt);

  if (p >= 1) {
    for (const id of getActors()) {
      if (seg.moves && seg.moves[id]) basePos[id] = seg.moves[id].slice();
    }
    if (seg.pass) ballHolder = seg.pass[1];
    if (seg.shot) {
      flashEl.classList.remove("goal-flash");
      void flashEl.getBoundingClientRect();
      flashEl.classList.add("goal-flash");
    }
    segIdx++;
    segElapsed = 0;
    if (segIdx >= curPlay.segs.length) {
      running = false;
      finished = true;
      btnPlay.textContent = "↺ もう一度";
      updateSteps(curPlay.segs.length);
      courtTitle.textContent = curPlay.name + " — ナイスプレー！🎉";
      return;
    }
    updateSteps(segIdx);
    courtTitle.textContent = curPlay.segs[segIdx].desc;
  }
  rafId = requestAnimationFrame(frame);
}

btnPlay.addEventListener("click", () => {
  if (finished) resetPlay();
  if (running) {
    running = false;
    btnPlay.textContent = "▶ 再生";
  } else {
    running = true;
    lastTs = null;
    btnPlay.textContent = "⏸ 一時停止";
    updateSteps(segIdx);
    courtTitle.textContent = curPlay.segs[segIdx].desc;
    rafId = requestAnimationFrame(frame);
  }
});
btnReset.addEventListener("click", resetPlay);
spdSlow.addEventListener("click", () => {
  speed = .55;
  spdSlow.classList.add("active");
  spdNorm.classList.remove("active");
});
spdNorm.addEventListener("click", () => {
  speed = 1;
  spdNorm.classList.add("active");
  spdSlow.classList.remove("active");
});

const playSelect = document.getElementById("playSelect");
let lastGroup = null;
PLAYS.forEach(play => {
  if (play.group !== lastGroup) {
    const label = document.createElement("div");
    label.className = "play-group-label";
    label.textContent = play.group;
    playSelect.appendChild(label);
    lastGroup = play.group;
  }
  const btn = document.createElement("button");
  btn.textContent = play.name;
  btn.dataset.id = play.id;
  btn.addEventListener("click", () => selectPlay(play.id));
  playSelect.appendChild(btn);
});

function selectPlay(id) {
  curPlay = PLAYS.find(p => p.id === id);
  document.querySelectorAll("#playSelect button").forEach(b =>
    b.classList.toggle("active", b.dataset.id === id));
  document.getElementById("fName").textContent = curPlay.name;
  document.getElementById("fEn").textContent = curPlay.en;
  document.getElementById("fPurpose").textContent = curPlay.purpose;
  document.getElementById("fTip").innerHTML = "💡 " + curPlay.tip;
  document.getElementById("fSteps").innerHTML =
    curPlay.segs.map(s => `<li>${s.desc}</li>`).join("");
  resetPlay();
}

const tabPositions = document.getElementById("tabPositions");
const tabPlays = document.getElementById("tabPlays");

function setMode(mode) {
  const isPos = mode === "positions";
  tabPositions.classList.toggle("active", isPos);
  tabPlays.classList.toggle("active", !isPos);
  markersG.style.display = isPos ? "" : "none";
  legend.style.display = isPos ? "" : "none";
  playersG.style.display = isPos ? "none" : "";
  playControls.hidden = isPos;
  document.getElementById("detail").hidden = !isPos;
  document.getElementById("formationDetail").hidden = isPos;
  if (isPos) {
    cancelAnimationFrame(rafId);
    running = false;
    courtTitle.textContent = COURT_TITLE_DEFAULT;
  } else {
    resetPlay();
  }
}
tabPositions.addEventListener("click", () => setMode("positions"));
tabPlays.addEventListener("click", () => setMode("plays"));

selectPlay("pickroll");
setMode("positions");
</script>

</body>
</html>
