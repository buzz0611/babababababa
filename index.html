<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バスケットボール ポジション解説</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #1f2430;
    --sub: #5b6270;
    --court: #e8b06d;
    --court-line: #ffffff;
    --accent: #d95d39;
    --pg: #e63946;
    --sg: #f4a261;
    --sf: #2a9d8f;
    --pf: #457b9d;
    --c:  #6d597a;
    --shadow: 0 6px 24px rgba(31,36,48,.10);
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  header {
    text-align: center;
    padding: 40px 20px 16px;
  }
  header h1 {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    letter-spacing: .04em;
  }
  header h1 .ball { color: var(--accent); }
  header p {
    color: var(--sub);
    margin-top: 8px;
    font-size: .95rem;
  }
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px 20px 60px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .container { grid-template-columns: 1fr; }
  }

  /* ---- コート ---- */
  .court-panel {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    position: sticky;
    top: 16px;
  }
  @media (max-width: 820px) {
    .court-panel { position: static; }
  }
  .court-panel h2 {
    font-size: 1rem;
    color: var(--sub);
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  svg.court { width: 100%; height: auto; display: block; border-radius: 12px; }
  .pos-marker { cursor: pointer; }
  .pos-marker circle.dot {
    stroke: #fff;
    stroke-width: 3;
    transition: r .15s ease, filter .15s ease;
  }
  .pos-marker text {
    fill: #fff;
    font-weight: 700;
    font-size: 15px;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
    user-select: none;
  }
  .pos-marker:hover circle.dot { filter: brightness(1.12); }
  .pos-marker.active circle.dot {
    filter: brightness(1.05);
  }
  .pos-marker circle.pulse {
    fill: none;
    stroke-width: 3;
    opacity: 0;
  }
  .pos-marker.active circle.pulse {
    animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse {
    0%   { opacity: .8; r: 20; }
    100% { opacity: 0;  r: 34; }
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
  }
  .legend button {
    border: 2px solid transparent;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: .85rem;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .legend button:hover { transform: translateY(-2px); }
  .legend button.active {
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px currentColor;
  }

  /* ---- 解説カード ---- */
  .detail {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .detail-header {
    padding: 24px 24px 18px;
    color: #fff;
    transition: background-color .25s ease;
  }
  .detail-header .number {
    font-size: .8rem;
    font-weight: 700;
    opacity: .85;
    letter-spacing: .1em;
  }
  .detail-header h2 {
    font-size: 1.5rem;
    margin-top: 2px;
  }
  .detail-header .en {
    font-size: .9rem;
    opacity: .9;
  }
  .detail-body { padding: 22px 24px 26px; }
  .detail-body .tagline {
    font-weight: 700;
    font-size: 1.05rem;
    margin-bottom: 10px;
  }
  .detail-body p.desc {
    color: var(--sub);
    font-size: .95rem;
    margin-bottom: 18px;
  }
  .section-title {
    font-size: .8rem;
    font-weight: 700;
    color: var(--sub);
    letter-spacing: .08em;
    margin-bottom: 8px;
    border-left: 4px solid var(--accent);
    padding-left: 8px;
  }
  ul.roles {
    list-style: none;
    margin-bottom: 18px;
  }
  ul.roles li {
    position: relative;
    padding-left: 22px;
    font-size: .93rem;
    margin-bottom: 6px;
  }
  ul.roles li::before {
    content: "●";
    position: absolute;
    left: 4px;
    font-size: .6rem;
    top: .45em;
    color: var(--accent);
  }
  .stats { margin-bottom: 18px; }
  .stat-row {
    display: grid;
    grid-template-columns: 7em 1fr 2.5em;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: .85rem;
  }
  .bar {
    background: #edeae2;
    border-radius: 999px;
    height: 10px;
    overflow: hidden;
  }
  .bar > span {
    display: block;
    height: 100%;
    border-radius: 999px;
    width: 0;
    transition: width .5s ease;
  }
  .stat-val { text-align: right; font-weight: 700; color: var(--sub); }
  .players {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .players span {
    background: #f0eee8;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: .85rem;
    font-weight: 600;
  }
  .tip {
    margin-top: 18px;
    background: #fdf3ec;
    border-left: 4px solid var(--accent);
    border-radius: 0 10px 10px 0;
    padding: 12px 14px;
    font-size: .88rem;
  }
  .tip strong { color: var(--accent); }

  footer {
    text-align: center;
    color: var(--sub);
    font-size: .8rem;
    padding: 0 20px 40px;
  }
</style>
</head>
<body>

<header>
  <h1><span class="ball">🏀</span> バスケットボール ポジション解説</h1>
  <p>コート上のマーカー、またはボタンをタップして各ポジションの役割を見てみよう</p>
</header>

<div class="container">

  <!-- コート -->
  <div class="court-panel">
    <h2>ハーフコートでの基本配置（オフェンス時の一例）</h2>
    <svg class="court" viewBox="0 0 500 470" role="img" aria-label="バスケットボールのハーフコート図">
      <!-- コート面 -->
      <rect x="0" y="0" width="500" height="470" fill="var(--court)" rx="12"/>
      <!-- 外枠 -->
      <rect x="15" y="15" width="470" height="440" fill="none" stroke="var(--court-line)" stroke-width="4"/>
      <!-- ペイントエリア -->
      <rect x="170" y="15" width="160" height="190" fill="#d99a54" stroke="var(--court-line)" stroke-width="4"/>
      <!-- フリースローサークル -->
      <circle cx="250" cy="205" r="60" fill="none" stroke="var(--court-line)" stroke-width="4"/>
      <!-- 3ポイントライン -->
      <path d="M 45 15 L 45 60 A 230 230 0 0 0 455 60 L 455 15" fill="none" stroke="var(--court-line)" stroke-width="4"/>
      <!-- リング・バックボード -->
      <line x1="215" y1="30" x2="285" y2="30" stroke="var(--court-line)" stroke-width="5"/>
      <circle cx="250" cy="50" r="12" fill="none" stroke="#c1440e" stroke-width="4"/>
      <!-- センターライン(下端の半円) -->
      <path d="M 190 455 A 60 60 0 0 1 310 455" fill="none" stroke="var(--court-line)" stroke-width="4"/>

      <!-- ポジションマーカー(JSで生成) -->
      <g id="markers"></g>
    </svg>
    <div class="legend" id="legend"></div>
  </div>

  <!-- 解説 -->
  <div class="detail" id="detail">
    <div class="detail-header" id="detailHeader">
      <div class="number" id="dNumber"></div>
      <h2 id="dName"></h2>
      <div class="en" id="dEn"></div>
    </div>
    <div class="detail-body">
      <div class="tagline" id="dTagline"></div>
      <p class="desc" id="dDesc"></p>

      <div class="section-title">主な役割</div>
      <ul class="roles" id="dRoles"></ul>

      <div class="section-title">求められる能力</div>
      <div class="stats" id="dStats"></div>

      <div class="section-title">代表的な選手</div>
      <div class="players" id="dPlayers"></div>

      <div class="tip" id="dTip"></div>
    </div>
  </div>
</div>

<footer>
  ※ 現代バスケットボールでは「ポジションレス」の考え方が広がり、役割の境界は柔軟になっています。
</footer>

<script>
const POSITIONS = [
  {
    id: "pg",
    number: "1番",
    name: "ポイントガード",
    en: "Point Guard (PG)",
    color: "var(--pg)",
    colorHex: "#e63946",
    x: 250, y: 390,
    tagline: "コート上の司令塔",
    desc: "チームで最もボールを扱う時間が長く、攻撃の組み立てを担うポジション。監督の戦術をコート上で表現する「コート上の監督」とも呼ばれます。",
    roles: [
      "ボール運びとオフェンスの組み立て",
      "味方へのパス配給とゲームコントロール",
      "試合のテンポ（速攻かセットオフェンスか）の判断",
      "相手ガードへのプレッシャーディフェンス"
    ],
    stats: [
      ["ハンドリング", 95],
      ["パス", 95],
      ["視野・判断力", 90],
      ["スピード", 85],
      ["シュート", 75]
    ],
    players: ["ステフィン・カリー", "クリス・ポール", "河村勇輝", "田臥勇太"],
    tip: "背が低くても活躍しやすいポジション。<strong>ドリブルと状況判断</strong>を磨くことが上達への近道です。"
  },
  {
    id: "sg",
    number: "2番",
    name: "シューティングガード",
    en: "Shooting Guard (SG)",
    color: "var(--sg)",
    colorHex: "#f4a261",
    x: 105, y: 300,
    tagline: "チーム随一の得点源",
    desc: "その名の通りシュート、特に3ポイントやミドルシュートで得点を狙うポジション。オフボール（ボールを持っていない時）の動きで自らチャンスを作り出します。",
    roles: [
      "3ポイントを中心としたアウトサイドからの得点",
      "スクリーンを使ってノーマークを作るオフボールの動き",
      "PGの補助としてのボール運び",
      "相手エースへのディフェンス"
    ],
    stats: [
      ["シュート", 95],
      ["オフボールの動き", 90],
      ["スピード", 85],
      ["ハンドリング", 80],
      ["ディフェンス", 75]
    ],
    players: ["クレイ・トンプソン", "デビン・ブッカー", "富永啓生"],
    tip: "シュート力がすべての基本。<strong>同じフォームで打ち続ける反復練習</strong>と、パスを受ける前の準備（キャッチ&シュート）が重要です。"
  },
  {
    id: "sf",
    number: "3番",
    name: "スモールフォワード",
    en: "Small Forward (SF)",
    color: "var(--sf)",
    colorHex: "#2a9d8f",
    x: 395, y: 300,
    tagline: "攻守万能のオールラウンダー",
    desc: "外からのシュートもゴールへのドライブもこなす、最も万能性が求められるポジション。チームのエースが務めることが多い花形ポジションです。",
    roles: [
      "ドライブ（切り込み）とアウトサイドの両方で得点",
      "速攻の走り込みとフィニッシュ",
      "リバウンド争いへの参加",
      "複数ポジションを守るスイッチディフェンス"
    ],
    stats: [
      ["得点力", 95],
      ["万能性", 95],
      ["1on1", 90],
      ["身体能力", 85],
      ["リバウンド", 70]
    ],
    players: ["レブロン・ジェームズ", "ケビン・デュラント", "八村塁", "馬場雄大"],
    tip: "「何でもできる」が武器。<strong>得意分野を1つ作りつつ苦手をなくす</strong>バランス型の練習が向いています。"
  },
  {
    id: "pf",
    number: "4番",
    name: "パワーフォワード",
    en: "Power Forward (PF)",
    color: "var(--pf)",
    colorHex: "#457b9d",
    x: 140, y: 130,
    tagline: "ゴール下の力仕事人",
    desc: "ゴール近くで体を張るプレーが持ち味のポジション。リバウンドやスクリーンなど、目立たなくてもチームを支える泥臭い仕事を数多く担います。現代では3ポイントを打てる「ストレッチ4」も主流です。",
    roles: [
      "オフェンス・ディフェンス両方のリバウンド",
      "スクリーンで味方のチャンスを作る",
      "ゴール下・ミドルレンジでの得点",
      "インサイドの守りとボックスアウト"
    ],
    stats: [
      ["フィジカル", 95],
      ["リバウンド", 90],
      ["スクリーン", 90],
      ["ゴール下の得点", 85],
      ["3ポイント", 65]
    ],
    players: ["ヤニス・アデトクンボ", "ティム・ダンカン", "ジョシュ・ホーキンソン"],
    tip: "体の当て方・使い方が上達のカギ。<strong>ボックスアウトとスクリーンの技術</strong>は地味ですが勝敗を大きく左右します。"
  },
  {
    id: "c",
    number: "5番",
    name: "センター",
    en: "Center (C)",
    color: "var(--c)",
    colorHex: "#6d597a",
    x: 320, y: 105,
    tagline: "ゴールを守る最後の砦",
    desc: "チームで最も背が高い選手が務めることが多く、ゴール下の攻防の中心となるポジション。ブロックショットやリバウンドでディフェンスの要となります。",
    roles: [
      "ゴール下での得点（ポストプレー）",
      "ブロックショットによるリム保護",
      "リバウンドの確保",
      "スクリーンとピック&ロールの合わせ"
    ],
    stats: [
      ["高さ", 95],
      ["リバウンド", 95],
      ["ブロック", 90],
      ["ポストプレー", 85],
      ["機動力", 60]
    ],
    players: ["ニコラ・ヨキッチ", "シャキール・オニール", "渡邊雄太（C起用時）"],
    tip: "高さだけに頼らないことが大切。<strong>ポジション取り（シール）とゴール下の確実なフィニッシュ</strong>を身につけましょう。"
  }
];

const markersG = document.getElementById("markers");
const legend = document.getElementById("legend");
const svgNS = "http://www.w3.org/2000/svg";

POSITIONS.forEach(pos => {
  // コート上マーカー
  const g = document.createElementNS(svgNS, "g");
  g.classList.add("pos-marker");
  g.dataset.id = pos.id;
  g.setAttribute("tabindex", "0");
  g.setAttribute("role", "button");
  g.setAttribute("aria-label", pos.name);

  const pulse = document.createElementNS(svgNS, "circle");
  pulse.classList.add("pulse");
  pulse.setAttribute("cx", pos.x);
  pulse.setAttribute("cy", pos.y);
  pulse.setAttribute("r", 20);
  pulse.setAttribute("stroke", pos.colorHex);

  const dot = document.createElementNS(svgNS, "circle");
  dot.classList.add("dot");
  dot.setAttribute("cx", pos.x);
  dot.setAttribute("cy", pos.y);
  dot.setAttribute("r", 20);
  dot.setAttribute("fill", pos.colorHex);

  const label = document.createElementNS(svgNS, "text");
  label.setAttribute("x", pos.x);
  label.setAttribute("y", pos.y);
  label.textContent = pos.en.match(/\(([^)]+)\)/)[1];

  g.append(pulse, dot, label);
  g.addEventListener("click", () => select(pos.id));
  g.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(pos.id); }
  });
  markersG.appendChild(g);

  // 凡例ボタン
  const btn = document.createElement("button");
  btn.textContent = pos.name;
  btn.style.background = pos.colorHex;
  btn.style.color = "#fff";
  btn.dataset.id = pos.id;
  btn.addEventListener("click", () => select(pos.id));
  legend.appendChild(btn);
});

function select(id) {
  const pos = POSITIONS.find(p => p.id === id);
  if (!pos) return;

  document.querySelectorAll(".pos-marker").forEach(m =>
    m.classList.toggle("active", m.dataset.id === id));
  document.querySelectorAll(".legend button").forEach(b => {
    const active = b.dataset.id === id;
    b.classList.toggle("active", active);
  });

  document.getElementById("detailHeader").style.backgroundColor = pos.colorHex;
  document.getElementById("dNumber").textContent = pos.number + "ポジション";
  document.getElementById("dName").textContent = pos.name;
  document.getElementById("dEn").textContent = pos.en;
  document.getElementById("dTagline").textContent = pos.tagline;
  document.getElementById("dDesc").textContent = pos.desc;

  document.getElementById("dRoles").innerHTML =
    pos.roles.map(r => `<li>${r}</li>`).join("");

  document.getElementById("dStats").innerHTML = pos.stats.map(([label, val]) => `
    <div class="stat-row">
      <div>${label}</div>
      <div class="bar"><span style="background:${pos.colorHex}"></span></div>
      <div class="stat-val">${val}</div>
    </div>`).join("");
  // バーのアニメーション
  requestAnimationFrame(() => {
    document.querySelectorAll("#dStats .bar > span").forEach((span, i) => {
      span.style.width = pos.stats[i][1] + "%";
    });
  });

  document.getElementById("dPlayers").innerHTML =
    pos.players.map(p => `<span>${p}</span>`).join("");
  document.getElementById("dTip").innerHTML = "💡 " + pos.tip;
}

select("pg");
</script>
</body>
</html>
