.cols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); align-items: start; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 13.5px; padding: 6px 13px; border-radius: 7px; cursor: pointer; white-space: nowrap; }

input, select, textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; width: 100%; min-width: 0; }

<script>
(() => {
'use strict';

// ===== 定数 =====
const WASTE = ['燃え殻','汚泥','廃油','廃酸','廃アルカリ','廃プラスチック類','ゴムくず','金属くず','ガラスくず・コンクリートくず及び陶磁器くず','鉱さい','がれき類','ばいじん','紙くず','木くず','繊維くず','動植物性残さ','動物系固形不要物','動物のふん尿','動物の死体','13号廃棄物','混合廃棄物','石綿含有産業廃棄物','水銀使用製品産業廃棄物',
  '【特管】廃油（引火性）','【特管】廃酸（腐食性）','【特管】廃アルカリ（腐食性）','【特管】感染性産業廃棄物','【特管】廃石綿等','【特管】廃PCB等','【特管】特定有害産業廃棄物'];
const METHODS = ['破砕','選別','圧縮','切断','焼却','溶融','中和','脱水','乾燥','油水分離','堆肥化','RPF化','固形燃料化','安定型埋立','管理型埋立','遮断型埋立'];
const UNITS = ['t','kg','m3','L','個','台'];
const MEDIUM = { paper: '紙', electronic: '電子' };
// 祝日（2024〜2030年、内閣府の祝日データより）
const HOLIDAYS = new Set('240101,240108,240211,240212,240223,240320,240429,240503,240504,240505,240506,240715,240811,240812,240916,240922,240923,241014,241103,241104,241123,250101,250113,250211,250223,250224,250320,250429,250503,250504,250505,250506,250721,250811,250915,250923,251013,251103,251123,251124,260101,260112,260211,260223,260320,260429,260503,260504,260505,260506,260720,260811,260921,260922,260923,261012,261103,261123,270101,270111,270211,270223,270321,270322,270429,270503,270504,270505,270719,270811,270920,270923,271011,271103,271123,280101,280110,280211,280223,280320,280321,280429,280503,280504,280505,280717,280811,280918,280922,281009,281103,281123,290101,290108,290211,290212,290223,290320,290430,290503,290504,290505,290716,290811,290813,290917,290923,290924,291008,291103,291123,300101,300114,300211,300223,300320,300429,300503,300504,300505,300506,300715,300811,300916,300923,301014,301103,301104,301123'.split(','));

// ===== 交付番号 =====
// 紙マニフェストの交付番号は11桁で、末尾はチェックデジット（先頭10桁を7で割った余り）
const normNo = (v) => String(v || '').replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[\s\-ー－‐]/g, '');
function checkNo(no, medium) {
  if (medium === 'electronic') return /^\d+$/.test(no) ? '' : '登録番号は数字だけで入力してください';
  if (!/^\d{11}$/.test(no)) return `交付番号は11桁の数字で入力してください（いまは${no.length}文字です）`;
  const c = Number(no.slice(0, 10)) % 7;
  return Number(no[10]) === c ? '' : `交付番号の末尾（チェックデジット）が合いません。先頭10桁から計算すると末尾は「${c}」になります。番号を見直してください`;
}

// ===== 日付 =====
const pd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const fd = (d) => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = pd(s); d.setUTCDate(d.getUTCDate() + n); return fd(d); };
const diff = (a, b) => Math.round((pd(b) - pd(a)) / 86400000);
const today = () => fd(new Date(Date.now() + 9 * 3600e3));
const jp = (s) => s ? s.replace(/-/g, '/') : '';
const isOff = (s) => { const w = pd(s).getUTCDay(); const md = s.slice(5); return w === 0 || w === 6 || md >= '12-29' || md <= '01-03' || HOLIDAYS.has(s.slice(2).replace(/-/g, '')); };
const addBiz = (s, n) => { let c = s; while (n > 0) { c = addDays(c, 1); if (!isOff(c)) n--; } return c; };
const fy = (s, start) => { const [y, m] = s.split('-').map(Number); return m >= start ? y : y - 1; };
const fyRange = (y, start) => { const mm = String(start).padStart(2, '0'); return { from: `${y}-${mm}-01`, to: addDays(`${y + 1}-${mm}-01`, -1) }; };
const monthRange = (ym) => { const [y, m] = ym.split('-').map(Number); const nx = m === 12 ? `${y + 1}-01-01` : `${y}-${String(m + 1).padStart(2, '0')}-01`; return { from: `${ym}-01`, to: addDays(nx, -1) }; };

// ===== 期限計算 =====
const RANK = { overdue: 0, soon: 1, pending: 2, waiting: 3, late_done: 4, done: 5 };
const STATE_LABEL = { overdue: '期限超過', soon: '期限間近', pending: '対応待ち', waiting: '起点待ち', late_done: '遅延完了', done: '完了' };
const STATE_CLS = { overdue: 'bad', soon: 'warn', pending: 'info', waiting: '', late_done: 'warn', done: 'ok' };
function task(key, label, due, done, t, soon, waitingFor) {
  if (done) return { key, label, due, done, state: due && done > due ? 'late_done' : 'done', left: null };
  if (!due) return { key, label, due: null, done: null, state: 'waiting', left: null, waitingFor };
  const left = diff(t, due);
  return { key, label, due, done: null, state: left < 0 ? 'overdue' : left <= soon ? 'soon' : 'pending', left };
}
function primaryTasks(m, t) {
  const fac = byId('facilities', m.facilityId);
  const finalFac = !!fac?.isFinalDisposal;
  const end = m.disposalEndDate || null;
  const fStart = finalFac ? end : (m.finalNoticeReceivedDate || null);
  const fWait = finalFac || !end ? '処分終了の登録待ち' : '二次委託先の最終処分終了待ち';
  if (m.medium === 'electronic') return [
    task('disposalReportedDate', '処分終了報告（JWNET）', end && addBiz(end, 3), m.disposalReportedDate, t, 1, '処分終了の登録待ち'),
    task('finalReportedDate', '最終処分終了報告（JWNET）', fStart && addBiz(fStart, 3), m.finalReportedDate, t, 1, fWait),
  ];
  const ts = [];
  if (m.transporterId) ts.push(task('c2SentDate', 'C2票送付（運搬業者へ）', end && addDays(end, 10), m.c2SentDate, t, 3, '処分終了の登録待ち'));
  ts.push(task('dSentDate', 'D票送付（排出事業者へ）', end && addDays(end, 10), m.dSentDate, t, 3, '処分終了の登録待ち'));
  ts.push(task('eSentDate', 'E票送付（排出事業者へ）', fStart && addDays(fStart, 10), m.eSentDate, t, 3, fWait));
  return ts;
}
function secondaryTasks(s, t) {
  const span = s.special ? 60 : 90, paper = s.medium !== 'electronic', ts = [];
  if (!paper) ts.push(task('registeredDate', 'JWNET登録', addBiz(s.issueDate, 3), s.registeredDate, t, 1));
  const c = (key, label, days) => { const x = task(key, label, addDays(s.issueDate, days), s[key], t, 14); if (x.state === 'overdue') x.report = addDays(x.due, 30); ts.push(x); };
  c('b2Date', paper ? 'B2票（運搬終了）' : '運搬終了報告', span);
  c('dDate', paper ? 'D票（処分終了）' : '処分終了報告', span);
  c('eDate', paper ? 'E票（最終処分終了）' : '最終処分終了報告', 180);
  return ts;
}
const worst = (ts) => ts.reduce((w, x) => RANK[x.state] < RANK[w] ? x.state : w, 'done');

// ===== データ =====
const S = { company: {}, facilities: [], partners: [], manifests: [], secondaries: [] };
const COLLS = ['facilities', 'partners', 'manifests', 'secondaries'];
const byId = (c, id) => S[c].find((x) => x.id === id);
const pname = (id) => byId('partners', id)?.name || '';
const fname = (id) => byId('facilities', id)?.name || '';
const startMonth = () => Number(S.company.ledgerStartMonth) || 4;
let db = null, downloads = null, mode = 'connecting';
const LS = 'mf-proc-web-v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
function loadLocal() { try { const j = JSON.parse(localStorage.getItem(LS) || 'null'); if (j) Object.assign(S, j); } catch (e) {} }

async function put(coll, rec) {
  const body = JSON.parse(JSON.stringify(rec));
  if (!body.id) body.id = uid();
  body.updatedAt = new Date().toISOString();
  // 画面にはすぐ反映し、保存先へ書き込む（共有データは後から届く最新の内容で上書きされる）
  const i = S[coll].findIndex((x) => x.id === body.id);
  const prev = i >= 0 ? S[coll][i] : null;
  if (i >= 0) S[coll][i] = body; else S[coll].push(body);
  render();
  if (db) {
    try { await db.collection(coll).doc(body.id).set(body); }
    catch (e) { S[coll] = prev ? S[coll].map((x) => x.id === body.id ? prev : x) : S[coll].filter((x) => x.id !== body.id); render(); throw e; }
  } else saveLocal();
  return body;
}
async function del(coll, id) {
  if (db) await db.collection(coll).doc(id).delete();
  else { S[coll] = S[coll].filter((x) => x.id !== id); saveLocal(); render(); }
}
async function putCompany(c) {
  if (db) await db.doc('settings/company').set(c);
  else { S.company = c; saveLocal(); render(); }
}
function dbError(e) {
  const code = e && e.code;
  if (code === 'invalid_argument') return '保存する権限がありません（閲覧のみで共有されています）';
  if (code === 'quota_exceeded') return '保存できる件数の上限に達しました。不要なデータを削除してください';
  return '保存できませんでした。通信状態を確認して、もう一度お試しください';
}

// ===== 共通UI =====
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const q3 = (n) => n == null || n === '' ? '—' : `${Number(n).toLocaleString('ja-JP', { maximumFractionDigits: 3 })} t`;
const r3 = (n) => Math.round(n * 1000) / 1000;
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
const tagState = (st, text) => `<span class="tag ${STATE_CLS[st]}">${esc(text ?? STATE_LABEL[st])}</span>`;
function shortTask(x) {
  const n = x.label.replace(/（.*?）/g, '');
  if (x.state === 'overdue') return `${n} ${-x.left}日超過`;
  if (x.state === 'soon' || x.state === 'pending') return `${n} 〜${jp(x.due).slice(5)}`;
  if (x.state === 'waiting') return `${n} 待ち`;
  return x.state === 'late_done' ? `${n} 遅延済` : `${n} 済`;
}
const taskTags = (ts) => `<div class="tags">${ts.map((x) => tagState(x.state, shortTask(x))).join('')}</div>`;

function field(f, rec) {
  const v = rec[f.k] ?? f.def ?? '';
  const id = `f_${f.k}`;
  const lab = `<span class="${f.req ? 'req' : ''}">${esc(f.l)}</span>`;
  if (f.t === 'check') return `<label class="check${f.wide ? ' wide' : ''}"><input type="checkbox" id="${id}" name="${f.k}"${v ? ' checked' : ''}>${esc(f.l)}</label>`;
  if (f.t === 'select') return `<label class="${f.wide ? 'wide' : ''}">${lab}<select id="${id}" name="${f.k}">${opts(typeof f.o === 'function' ? f.o() : f.o, v, f.blank)}</select></label>`;
  if (f.t === 'area') return `<label class="wide">${lab}<textarea id="${id}" name="${f.k}">${esc(v)}</textarea></label>`;
  const type = f.t === 'date' ? 'date' : 'text';
  const extra = f.t === 'num' ? ' inputmode="decimal"' : '';
  const list = f.list ? ` list="${f.list}"` : '';
  return `<label class="${f.wide ? 'wide' : ''}">${lab}<input id="${id}" name="${f.k}" type="${type}" value="${esc(v)}"${extra}${list}${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}></label>`;
}

function readForm(root, gs) {
  const out = {};
  for (const g of gs) for (const f of g.f) {
    const el = root.querySelector(`[name="${f.k}"]`);
    if (!el) continue;
    if (f.t === 'check') out[f.k] = el.checked;
    else if (f.t === 'num') { const s = el.value.replace(/,/g, '').trim(); out[f.k] = s === '' ? null : (Number.isFinite(Number(s)) ? Number(s) : NaN); }
    else out[f.k] = el.value.trim() || (f.t === 'date' ? null : '');
  }
  return out;
}

function validateManifest(v, id) {
  if (!v.manifestNo) return v.medium === 'paper' ? '交付番号を入力してください' : '登録番号を入力してください';
  const noErr = checkNo(v.manifestNo, v.medium);
  if (noErr) return noErr;
  if (!v.issueDate) return '交付年月日（引渡し日）を入力してください';
  if (!v.facilityId) return '処分事業場を選んでください';
  if (!v.emitterId) return '排出事業者を選んでください';
  if (!v.wasteType) return '廃棄物の種類を選んでください';
  for (const k of ['declaredQty', 'receivedQtyT', 'disposedQtyT']) if (Number.isNaN(v[k])) return '数量は数字で入力してください';
  if (S.manifests.some((x) => x.id !== id && x.medium === v.medium && x.manifestNo === v.manifestNo)) return `番号「${v.manifestNo}」は既に登録されています`;
  if (v.receivedDate && v.receivedDate < v.issueDate) return '受入日が交付日より前になっています';
  if (v.disposalEndDate && !v.receivedDate) return '処分終了日を入れる前に受入日を入力してください';
  if (v.disposalEndDate && v.disposalEndDate < v.receivedDate) return '処分終了日が受入日より前になっています';
  for (const [k, l] of [['c2SentDate', 'C2票送付日'], ['dSentDate', 'D票送付日'], ['disposalReportedDate', '処分終了報告日']]) {
    if (v[k] && (!v.disposalEndDate || v[k] < v.disposalEndDate)) return `${l}は処分終了日以降の日付にしてください`;
  }
  return '';
}

async function propagateFinal(s) {
  if (!s.eDate) return 0;
  let n = 0;
  for (const l of s.links || []) {
    const m = byId('manifests', l.manifestId);
    if (!m || m.finalNoticeReceivedDate) continue;
    await put('manifests', { ...m, finalNoticeReceivedDate: s.eDate, finalDisposalDate: s.finalDisposalDate || s.eDate, finalDisposalPlace: s.finalDisposalPlace });
    n++;
  }
  return n;
}

    r.querySelector('#cx').onclick = closeDialog;
    r.querySelector('[name=disposerId]').addEventListener('change', (e) => { const p = byId('partners', e.target.value); const a = r.querySelector('[name=destAddress]'); if (p && !a.value) a.value = p.address || ''; });
    if (id) armDelete(r.querySelector('#del'), () => del('secondaries', id));
    r.querySelector('#save').onclick = async () => {
      const v = readForm(r, S_FORM);
      v.manifestNo = normNo(v.manifestNo);
      if (v.wasteType.startsWith('【特管】')) v.special = true;
      v.links = [...r.querySelectorAll('[data-link]')].filter((c) => c.checked).map((c) => {
        const a = r.querySelector(`[data-alloc="${c.dataset.link}"]`).value.trim();
        return { manifestId: c.dataset.link, qtyT: a === '' ? null : Number(a) };
      });
      const err = !v.manifestNo ? '交付番号（登録番号）を入力してください' : checkNo(v.manifestNo, v.medium) ? checkNo(v.manifestNo, v.medium) : !v.issueDate ? '交付日を入力してください' : !v.facilityId ? '処分事業場を選んでください'
        : !v.wasteType ? '処分後物の種類を選んでください' : v.qtyT == null || Number.isNaN(v.qtyT) ? '持出量を数字で入力してください' : !v.disposerId ? '委託先の処分業者を選んでください'
        : v.eDate && !v.finalDisposalPlace ? 'E票を受領したら最終処分の場所も入力してください'
        : v.links.some((l) => Number.isNaN(l.qtyT)) ? '按分量は数字で入力してください'
        : S.secondaries.some((x) => x.id !== id && x.medium === v.medium && x.manifestNo === v.manifestNo) ? `番号「${v.manifestNo}」は既に登録されています` : '';
      if (err) { r.querySelector('#err').textContent = err; return; }
      try {
        const saved = await put('secondaries', { ...s, ...v });
        const n = await propagateFinal(saved);
        toast(n ? `保存しました。受託マニフェスト${n}件に最終処分終了を反映しました` : '保存しました');
        openSecondary(saved.id);
      } catch (e) { toast(dbError(e)); }
    };
  });
}

function openRecord(coll, form, id, title) {

  openDialog(`<div class="dlg-head"><h2 style="margin:0">${esc(title)}${id ? 'の編集' : 'の追加'}</h2></div>

    if (id) armDelete(r.querySelector('#del'), async () => {
      const used = S.manifests.some((m) => [m.facilityId, m.emitterId, m.transporterId].includes(id)) || S.secondaries.some((s) => [s.facilityId, s.transporterId, s.disposerId].includes(id));

// ---- 帳簿 ----
function buildLedger(facId, from, to) {
  const inR = (d) => d && d >= from && d <= to;
  const ms = S.manifests.filter((m) => m.facilityId === facId), ss = S.secondaries.filter((s) => s.facilityId === facId);
  const rec = ms.filter((m) => inR(m.receivedDate)), dis = ms.filter((m) => inR(m.disposalEndDate)), out = ss.filter((s) => inR(s.issueDate));
  const E = [], issues = [];
  for (const m of rec) { E.push({ d: m.receivedDate, k: '受入', no: m.manifestNo, iss: m.issueDate, p: pname(m.emitterId), w: m.wasteType, me: '', q: m.receivedQtyT }); if (m.receivedQtyT == null) issues.push(`${m.manifestNo}：受入量が未入力`); }
  for (const m of dis) { E.push({ d: m.disposalEndDate, k: '処分', no: m.manifestNo, iss: m.issueDate, p: pname(m.emitterId), w: m.wasteType, me: m.disposalMethod, q: m.disposedQtyT }); if (m.disposedQtyT == null) issues.push(`${m.manifestNo}：処分量が未入力`); if (!m.disposalMethod) issues.push(`${m.manifestNo}：処分方法が未入力`); }
  for (const s of out) E.push({ d: s.issueDate, k: '持出', no: s.manifestNo, iss: s.issueDate, p: pname(s.disposerId), w: s.wasteType, me: s.destAddress, q: s.qtyT });
  const ord = { 受入: 0, 処分: 1, 持出: 2 };
  E.sort((a, b) => a.d.localeCompare(b.d) || ord[a.k] - ord[b.k] || a.no.localeCompare(b.no));
  const sum = (rows) => { const mp = new Map(); for (const r of rows) { const k = r.key + '\u0000' + r.w; const c = mp.get(k) || { key: r.key, w: r.w, q: 0, n: 0 }; c.q = r3(c.q + (r.q ?? 0)); c.n++; mp.set(k, c); } return [...mp.values()].sort((a, b) => a.key.localeCompare(b.key, 'ja')); };
  const tot = (xs) => r3(xs.reduce((a, b) => a + (b ?? 0), 0));
  return {
    E, issues,
    byE: sum(rec.map((m) => ({ key: pname(m.emitterId), w: m.wasteType, q: m.receivedQtyT }))),
    byM: sum(dis.map((m) => ({ key: m.disposalMethod || '（未入力）', w: m.wasteType, q: m.disposedQtyT }))),
    byD: sum(out.map((s) => ({ key: `${pname(s.disposerId)}${s.destAddress ? `（${s.destAddress}）` : ''}`, w: s.wasteType, q: s.qtyT }))),
    T: { r: tot(rec.map((m) => m.receivedQtyT)), d: tot(dis.map((m) => m.disposedQtyT)), o: tot(out.map((s) => s.qtyT)) },
  };
}
function ledgerArgs() {
  const facId = F.lFac || S.facilities[0]?.id;
  const year = F.lYear ?? fy(today(), startMonth());
  const range = F.lPeriod === 'year' ? fyRange(year, startMonth()) : monthRange(F.lMonth);
  return { facId, year, range };
}
function viewLedger() {
  if (!S.facilities.length) return `<div class="card"><h1>帳簿</h1><p class="empty">先に「マスタ」で処分事業場を登録してください。</p></div>`;
  const { facId, year, range } = ledgerArgs();
  const fac = byId('facilities', facId);
  const L = buildLedger(facId, range.from, range.to);

  return `<div class="card"><div class="row">
      <select id="lfac" style="max-width:220px" aria-label="事業場">${opts(facOpts(), facId)}</select>
      <select id="lper" style="max-width:110px" aria-label="期間">${opts([['month', '月別'], ['year', '年度']], F.lPeriod)}</select>
      ${F.lPeriod === 'month' ? `<input type="month" id="lmon" value="${F.lMonth}" style="max-width:170px" aria-label="対象月">` : `<select id="lyr" style="max-width:130px" aria-label="対象年度">${opts(years.map((y) => [y, `${y}年度`]), year)}</select>`}
      <span class="spacer"></span>
      <button class="btn" id="lcsv">CSVで保存</button>
    </div></div>
    <div class="card">
      <h1>処分業者帳簿（${esc(fac.name)}）</h1>
      <p class="muted">${esc(S.company.name || '（マスタで自社名を設定）')}　許可番号 ${esc(fac.permitNo || '未設定')}　所在地 ${esc(fac.address)}<br>対象期間 ${jp(range.from)} 〜 ${jp(range.to)}</p>
      ${L.issues.length ? `<div class="banner bad" style="margin-bottom:12px">記載漏れ：${esc(L.issues.join(' ／ '))}</div>` : ''}
      <div class="stats" style="margin-bottom:14px">
        <div class="stat"><div class="n">${q3(L.T.r)}</div><div class="l">受入量</div></div>
        <div class="stat"><div class="n">${q3(L.T.d)}</div><div class="l">処分量</div></div>
        <div class="stat"><div class="n">${q3(L.T.o)}</div><div class="l">持出量</div></div>
      </div>
      <h2>明細</h2>
      ${L.E.length ? `<div class="tw"><table><thead><tr><th>年月日</th><th>区分</th><th>管理票交付者／委託先</th><th>交付年月日</th><th>交付番号</th><th>廃棄物の種類</th><th>処分方法／持出先</th><th class="num">数量</th></tr></thead><tbody>
        ${L.E.map((e) => `<tr><td class="nw">${jp(e.d)}</td><td><span class="tag ${e.k === '受入' ? 'info' : e.k === '処分' ? 'ok' : 'warn'}">${e.k}</span></td><td>${esc(e.p)}</td><td class="nw">${jp(e.iss)}</td><td>${esc(e.no)}</td><td>${esc(e.w)}</td><td>${esc(e.me)}</td><td class="num">${q3(e.q)}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">この期間の記載事項はありません</div>'}
      <div class="cols" style="margin-top:8px">${summ('受入先ごとの受入量', '受入先', L.byE)}${summ('処分方法ごとの処分量', '処分方法', L.byM)}${summ('持出先ごとの持出量', '持出先', L.byD)}</div>
      <p class="muted" style="margin-bottom:0">帳簿は事業場ごとに備え付け、翌月末までに記載し、1年ごとに閉鎖して閉鎖後5年間保存します（廃棄物処理法施行規則 第10条の8）。</p>
    </div>`;
}
function ledgerCsv() {
  const { facId, range } = ledgerArgs();
  const fac = byId('facilities', facId);
  const L = buildLedger(facId, range.from, range.to);
  const rows = [['処分業者帳簿', fac.name, `${range.from}〜${range.to}`], [], ['年月日', '区分', '管理票交付者／委託先', '交付年月日', '交付番号', '廃棄物の種類', '処分方法／持出先', '数量(t)'],
    ...L.E.map((e) => [e.d, e.k, e.p, e.iss, e.no, e.w, e.me, e.q]), [],
    ['受入先ごとの受入量'], ['受入先', '種類', '件数', '数量(t)'], ...L.byE.map((r) => [r.key, r.w, r.n, r.q]), [],
    ['処分方法ごとの処分量'], ['処分方法', '種類', '件数', '数量(t)'], ...L.byM.map((r) => [r.key, r.w, r.n, r.q]), [],
    ['持出先ごとの持出量'], ['持出先', '種類', '件数', '数量(t)'], ...L.byD.map((r) => [r.key, r.w, r.n, r.q])];
  return { name: `帳簿_${fac.name}_${range.from}_${range.to}.csv`, text: '﻿' + rows.map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n') };
}

function viewMasters() {
  const c = S.company;
  return `<div class="card"><div class="row" style="margin-bottom:10px"><h2 style="margin:0">自社情報（処分業者）</h2></div>
      <form id="cform" novalidate>${groups(C_FORM, c).replace('<fieldset>', '<fieldset style="border:0;padding:0">').replace(/<legend>.*?<\/legend>/, '')}</form>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="csave">保存</button></div></div>
    <div class="card"><div class="row" style="margin-bottom:10px"><h2 style="margin:0">処分事業場</h2><span class="spacer"></span><button class="btn" data-new="f">＋ 追加</button></div>
      ${S.facilities.length ? `<div class="tw"><table><thead><tr><th>名称</th><th>所在地</th><th>許可番号</th><th>許可期限</th><th>処分方法</th><th>最終処分場</th></tr></thead><tbody>
        ${S.facilities.map((f) => `<tr class="click" data-open="f:${f.id}"><td>${esc(f.name)}</td><td>${esc(f.address)}</td><td>${esc(f.permitNo)}<div class="muted">${esc(f.permitAuthority)}</div></td><td class="nw">${jp(f.permitExpiry) || '—'}</td><td>${esc(f.methods)}</td><td>${f.isFinalDisposal ? '○' : ''}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">処分事業場を追加してください（帳簿は事業場ごとに作ります）</div>'}</div>
    <div class="card"><div class="row" style="margin-bottom:10px"><h2 style="margin:0">取引先</h2><span class="spacer"></span><button class="btn" data-new="p">＋ 追加</button></div>
      ${S.partners.length ? `<div class="tw"><table><thead><tr><th>名称</th><th>区分</th><th>住所</th><th>許可番号</th><th>許可期限</th><th>契約期限</th></tr></thead><tbody>
        ${[...S.partners].sort((a, b) => a.name.localeCompare(b.name, 'ja')).map((p) => `<tr class="click" data-open="p:${p.id}"><td>${esc(p.name)}</td><td>${[p.isEmitter && '排出', p.isTransporter && '運搬', p.isDisposer && '処分'].filter(Boolean).join('・')}</td><td>${esc(p.address)}</td><td>${esc(p.permitNo)}</td><td class="nw">${jp(p.permitExpiry) || '—'}</td><td class="nw">${jp(p.contractEnd) || '—'}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">排出事業者・収集運搬業者・二次委託先を追加してください</div>'}</div>
    ${S.manifests.some((m) => m.sample) || S.partners.some((p) => p.sample) ? `<div class="card"><h2>サンプルデータ</h2><p class="muted">「サンプル」と付いた例のデータが入っています。実際の運用を始めるときに消してください。</p><button class="btn danger" id="clearSample">サンプルデータを消す</button></div>` : ''}`;
}

// ===== イベント =====
document.addEventListener('click', async (e) => {
  const t = e.target;
  const open = t.closest('[data-open]');
  if (open && open.closest('#view')) {
    const [k, id] = open.dataset.open.split(':');
    if (k === 'm') openManifest(id); else if (k === 's') openSecondary(id);
    else if (k === 'f') openRecord('facilities', F_FORM, id, '処分事業場'); else if (k === 'p') openRecord('partners', P_FORM, id, '取引先');
    return;
  }
  const nw = t.closest('[data-new]');
  if (nw) { const k = nw.dataset.new; if (k === 'm') openManifest(); else if (k === 's') openSecondary(); else if (k === 'f') openRecord('facilities', F_FORM, null, '処分事業場'); else openRecord('partners', P_FORM, null, '取引先'); return; }
  const go = t.closest('[data-go]'); if (go) return setTab(go.dataset.go);
  const flt = t.closest('[data-filter]'); if (flt) { F.status = flt.dataset.filter; return setTab('manifests'); }
  const qk = t.closest('[data-quick]');
  if (qk) {
    const [k, id, key] = qk.dataset.quick.split(':');
    const coll = k === 'm' ? 'manifests' : 'secondaries';
    const rec = byId(coll, id);
    try { await put(coll, { ...rec, [key]: today() }); toast('完了にしました'); } catch (err) { toast(dbError(err)); }
    return;
  }
  if (t.id === 'csave') {
    const v = readForm($('#cform'), C_FORM);
    if (!v.name) return toast('自社の名称を入力してください');
    v.ledgerStartMonth = Math.min(12, Math.max(1, Math.trunc(v.ledgerStartMonth) || 4));
    try { await putCompany({ ...S.company, ...v }); toast('保存しました'); } catch (err) { toast(dbError(err)); }
    return;
  }
  if (t.id === 'lcsv') {
    const { name, text } = ledgerCsv();
    if (downloads) {
      try { await downloads.save({ filename: name, data: text }); } catch (err) { if (err?.code !== 'declined') { copy(text); } }
    } else copy(text);
    return;
  }
  if (t.id === 'clearSample') {
    if (!t.classList.contains('armed')) { t.classList.add('armed'); t.textContent = 'もう一度押すと消します'; return; }
    try {
      for (const c of COLLS) for (const r of S[c].filter((x) => x.sample)) await del(c, r.id);
      toast('サンプルデータを消しました');
    } catch (err) { toast(dbError(err)); }
  }
});
document.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id === 'fq') { F.q = e.target.value; render(); }
  if (id === 'sq') { F.sq = e.target.value; render(); }
});
document.addEventListener('change', (e) => {
  const { id, value, checked } = e.target;
  const map = { ffac: 'facility', fst: 'status', fmed: 'medium', lfac: 'lFac', lper: 'lPeriod', lmon: 'lMonth' };
  if (map[id]) { F[map[id]] = value; render(); }
  if (id === 'lyr') { F.lYear = Number(value); render(); }
  if (id === 'sopen') { F.open = checked; render(); }
});

// ===== 起動 =====
render();
(async () => {
  try { db = window.claude ? await window.claude.use('db') : null; } catch (e) { db = null; }
  try { downloads = window.claude ? await window.claude.use('downloads') : null; } catch (e) { downloads = null; }
  if (!db) { mode = 'local'; loadLocal(); render(); return; }
  mode = 'db';
  let pending = false;
  const schedule = () => { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; render(); }); };
  for (const c of COLLS) {
    db.collection(c).onSnapshot((snap) => { S[c] = snap.docs.map((d) => ({ ...d.data(), id: d.id })); schedule(); },
      () => { mode = 'local'; render(); });
  }
  db.doc('settings/company').onSnapshot((d) => { S.company = d.exists ? { ...d.data() } : {}; schedule(); });
  render();
})();
})();
</script>
